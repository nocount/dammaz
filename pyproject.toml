[project]
name = "dammaz"
version = "0.1.0"
description = "A homebrew dwarf language: phonology, lexicon, and English->Dammaz translator"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "wordfreq>=3.1",
]

[dependency-groups]
corpus = [
    "pyarrow>=25.0.1",
]
dev = [
    "pytest>=8.0",
]
nlp = [
    "en-core-web-sm",
    "spacy>=3.8.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dammaz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
