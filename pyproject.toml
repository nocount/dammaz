[project]
name = "dammaz"
version = "0.1.0"
description = "A homebrew dwarf language: phonology, lexicon, and English->Dammaz translator"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "wordfreq>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dammaz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
