# Hand-curated starting points for tools/propose.py. Anything not seeded here
# gets a freshly generated root (dammaz.wordgen). Nothing in this file is final:
# every seeded word still goes through the review CSV.
#
# Sense keys are lemma/POS. Each value is one of:
#   {dz: X, origin: invented|borrowed, from: "..."}   a fixed word
#   {base: "@lemma/POS+TAG"}                          derived from another sense's word
#   {base: "root+TAG"}                                derived from a known Dammaz root
#   {same: lemma/POS}                                 share another sense's word (synonym)

senses:
  # --- borrowed from Khazalid (content words; budget: see lexicon.MAX_BORROWED) ---
  dwarf/NOUN:    {dz: dawi,   origin: borrowed, from: "Khazalid dawi 'dwarfs'"}
  mountain/NOUN: {dz: karak,  origin: borrowed, from: "Khazalid karak 'mountain, stronghold'"}
  axe/NOUN:      {dz: az,     origin: borrowed, from: "Khazalid az 'war axe'"}
  hall/NOUN:     {dz: khaz,   origin: borrowed, from: "Khazalid khaz 'underground hall'"}
  hammer/NOUN:   {dz: grund,  origin: borrowed, from: "Khazalid grund 'hammer'"}
  king/NOUN:     {dz: rik,    origin: borrowed, from: "Khazalid rik 'king, lord'"}
  queen/NOUN:    {dz: rinn,   origin: borrowed, from: "Khazalid rinn 'lady dwarf, king's consort'"}
  grudge/NOUN:   {dz: dammaz, origin: borrowed, from: "Khazalid dammaz 'grudge'"}
  goblin/NOUN:   {dz: grobi,  origin: borrowed, from: "Khazalid grobi 'goblin'"}
  elf/NOUN:      {dz: elgi,   origin: borrowed, from: "Khazalid elgi 'elves, unbearded'"}
  man/NOUN:      {dz: umgi,   origin: borrowed, from: "Khazalid umgi 'humans, manlings'"}
  human/NOUN:    {same: man/NOUN}
  dragon/NOUN:   {dz: drakk,  origin: borrowed, from: "Khazalid drakk 'dragon'"}
  book/NOUN:     {dz: kron,   origin: borrowed, from: "Khazalid kron 'book, record'"}
  beard/NOUN:    {dz: tromm,  origin: borrowed, from: "Khazalid tromm 'beard; respect due to age'"}
  anvil/NOUN:    {dz: grong,  origin: borrowed, from: "Khazalid grong 'anvil'"}
  mine/VERB:     {same: dig/VERB}

  # --- kept from the approved sound check (samples/sound_check_v0.md) ----------
  old/ADJ:       {dz: dhal,   origin: invented}
  strong/ADJ:    {dz: krang,  origin: invented}
  deep/ADJ:      {dz: orn,    origin: invented}
  big/ADJ:       {dz: gorz,   origin: invented}
  dark/ADJ:      {dz: skom,   origin: invented}
  forge/VERB:    {dz: drash,  origin: invented}
  drink/VERB:    {dz: glok,   origin: invented}
  remember/VERB: {dz: unguz,  origin: invented}
  come/VERB:     {dz: vun,    origin: invented}
  see/VERB:      {dz: thiz,   origin: invented}
  speak/VERB:    {dz: kend,   origin: invented}
  talk/VERB:     {same: speak/VERB}
  make/VERB:     {dz: drand,  origin: invented}
  slay/VERB:     {dz: khurk,  origin: invented}
  kill/VERB:     {same: slay/VERB}
  fight/VERB:    {dz: skraf,  origin: invented}
  go/VERB:       {dz: truk,   origin: invented}
  know/VERB:     {dz: zork,   origin: invented}
  work/VERB:     {dz: krez,   origin: invented}
  ale/NOUN:      {dz: bral,   origin: invented}
  beer/NOUN:     {same: ale/NOUN}
  brother/NOUN:  {dz: zaka,   origin: invented}
  gold/NOUN:     {dz: gleth,  origin: invented}
  clan/NOUN:     {dz: thaluk, origin: invented}
  ancestor/NOUN: {dz: urdak,  origin: invented}
  enemy/NOUN:    {dz: skreka, origin: invented}
  fire/NOUN:     {dz: dhrak,  origin: invented}
  tunnel/NOUN:   {dz: skung,  origin: invented}
  promise/NOUN:  {same: oath/NOUN}
  stone/NOUN:    {dz: kurm,   origin: invented}
  rock/NOUN:     {same: stone/NOUN}
  iron/NOUN:     {dz: zath,   origin: invented}
  song/NOUN:     {dz: iza,    origin: invented}
  road/NOUN:     {dz: gont,   origin: invented}
  path/NOUN:     {same: road/NOUN}
  door/NOUN:     {same: gate/NOUN}
  day/NOUN:      {dz: zeng,   origin: invented}
  night/NOUN:    {dz: mulok,  origin: invented}

  # --- derived (grammar.md §2) ----------------------------------------------------
  sing/VERB:      {base: "@song/NOUN+VBZ"}
  friendly/ADJ:   {base: "@friend/NOUN+LIKE"}
  sunny/ADJ:      {base: "@sun/NOUN+LIKE"}
  colorful/ADJ:   {base: "@color/NOUN+LIKE"}
  careful/ADJ:    {base: "@care/VERB+LIKE"}
  dirty/ADJ:      {base: "@dirt/NOUN+LIKE"}
  scary/ADJ:      {base: "@scare/VERB+LIKE"}
  tasty/ADJ:      {base: "@taste/VERB+LIKE"}
  yummy/ADJ:      {same: tasty/ADJ}
  delicious/ADJ:  {same: tasty/ADJ}
  magical/ADJ:    {same: magic/ADJ}
  kitchen/NOUN:   {base: "@cook/VERB+PLACE"}
  school/NOUN:    {base: "@learn/VERB+PLACE"}
  park/NOUN:      {base: "@play/VERB+PLACE"}
  playground/NOUN: {same: park/NOUN}
  garden/NOUN:    {base: "@grow/VERB+PLACE"}
  store/NOUN:     {base: "@buy/VERB+PLACE"}
  shop/NOUN:      {same: store/NOUN}
  forest/NOUN:    {base: "@tree/NOUN+PLACE"}
  woods/NOUN:     {same: forest/NOUN}
  teacher/NOUN:   {base: "@teach/VERB+AGT"}
  farmer/NOUN:    {base: "@farm/NOUN+AGT"}
  driver/NOUN:    {base: "@drive/VERB+AGT"}
  owner/NOUN:     {base: "harg+AGT"}
  smith/NOUN:     {base: "@forge/VERB+AGT"}
  blacksmith/NOUN: {same: smith/NOUN}
  forge/NOUN:     {base: "@forge/VERB+PLACE"}
  miner/NOUN:     {base: "@dig/VERB+AGT"}
  mine/NOUN:      {base: "@dig/VERB+PLACE"}
  warrior/NOUN:   {base: "@fight/VERB+AGT"}
  tavern/NOUN:    {base: "@ale/NOUN+PLACE"}
  strength/NOUN:  {base: "@strong/ADJ+THING"}
  darkness/NOUN:  {base: "@dark/ADJ+THING"}

  # diminutives: base + -it (grammar.md §3.7)
  puppy/NOUN:     {base: "@dog/NOUN+DIM"}
  doggy/NOUN:     {same: puppy/NOUN}
  kitten/NOUN:    {base: "@cat/NOUN+DIM"}
  kitty/NOUN:     {same: kitten/NOUN}
  bunny/NOUN:     {base: "@rabbit/NOUN+DIM"}
  kid/NOUN:       {base: "@child/NOUN+DIM"}
  mommy/NOUN:     {base: "@mom/NOUN+DIM"}
  daddy/NOUN:     {base: "@dad/NOUN+DIM"}
  duckling/NOUN:  {base: "@duck/NOUN+DIM"}
  piglet/NOUN:    {base: "@pig/NOUN+DIM"}
  chick/NOUN:     {base: "@chicken/NOUN+DIM"}
  cub/NOUN:       {base: "@bear/NOUN+DIM"}
  lamb/NOUN:      {base: "@sheep/NOUN+DIM"}
  foal/NOUN:      {base: "@horse/NOUN+DIM"}
  calf/NOUN:      {base: "@cow/NOUN+DIM"}
  beardling/NOUN: {base: "@dwarf/NOUN+DIM"}

# Same lemma, different meaning per POS: never share one word across POS.
homonyms: [close, kind, mean, stick, right, well, fall, bear, watch, light, lie,
           fly, bark, land, rest, spring, fair, fine, match, park, can, saw, mine,
           forge, left, pet, rock, wave, trip, bat, top]

# Dwarf-genre vocabulary to include in the core batch even when rare in
# TinyStories (Phase 5 genre text needs it).
extra: [dwarf/NOUN, beard/NOUN, anvil/NOUN, smith/NOUN, forge/NOUN, forge/VERB,
        mine/NOUN, miner/NOUN, gold/NOUN, silver/NOUN, iron/NOUN, steel/NOUN,
        ale/NOUN, brew/VERB, tavern/NOUN, feast/NOUN, oath/NOUN, rune/NOUN,
        clan/NOUN, ancestor/NOUN, grudge/NOUN, axe/NOUN, hammer/NOUN, shield/NOUN,
        helmet/NOUN, armor/NOUN, tunnel/NOUN, cave/NOUN, gem/NOUN, treasure/NOUN,
        dragon/NOUN, troll/NOUN, orc/NOUN, goblin/NOUN, elf/NOUN, human/NOUN,
        war/NOUN, battle/NOUN, enemy/NOUN, honor/NOUN, warrior/NOUN, slay/VERB,
        strength/NOUN, darkness/NOUN, gate/NOUN, hall/NOUN, king/NOUN, queen/NOUN,
        mountain/NOUN, stone/NOUN, song/NOUN, brother/NOUN, speak/VERB,
        ancient/ADJ, deep/ADJ, dark/ADJ, strong/ADJ, old/ADJ, beardling/NOUN]
