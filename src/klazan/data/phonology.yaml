# Klazan phonology: normative, machine-readable. spec/phonology.md explains it.
#
# LEGALITY lives here (what a native Klazan root may look like).
# FREQUENCIES come from source_stats.json (measured on Khazalid/Zharralid) and
# are re-weighted by the style knobs below. Borrowed words are exempt from
# legality checks (they keep their source spelling, e.g. `dammaz`).

version: 0.1

alphabet: [a, b, d, e, f, g, h, i, k, l, m, n, o, r, s, t, u, v, w, y, z]
digraphs: [kh, zh, sh, th, dh, ng]   # each is ONE sound

vowels: [a, e, i, o, u]
# 'y' is always a consonant (as in "yes"). No diphthongs or vowel-vowel
# sequences in roots (keeps syllabification trivial).

consonants: [b, d, g, k, t, f, v, s, z, sh, zh, th, dh, kh, h, m, n, ng, l, r, w, y]

# Word-initial clusters ('' = vowel-initial). Anything not listed is illegal.
initials:
  - ''
  - [b, d, g, k, t, f, v, s, z, sh, zh, th, dh, kh, h, m, n, l, r, w, y]
  - [gr, dr, kr, br, tr, fr, thr, khr, dhr, kl, gl, fl, sk, skr, st, str, sl, sm, dw, kv]

# Word-final clusters ('' = vowel-final).
finals:
  - ''
  - [k, g, z, d, t, n, m, l, r, ng, f, s, sh, zh, th, kh, b]
  - [nd, nk, nt, rn, rk, rg, rm, rl, rd, ld, lk, lg, zk, rz]

# Medial clusters: any (final-part + initial-part) with at most 3 consonant
# segments, where final-part is '' or one of these codas and initial-part is ''
# or a legal initial. A medial must contain at least one consonant.
medial_codas: [k, g, z, d, t, n, m, l, r, ng, s, sh, zh, th, kh, b, f]
max_medial_consonants: 3
# Keeps long words from turning into consonant soup: summed over all of a
# word's clusters, (consonants in cluster - 1) may not exceed this.
# 'drekrazal' = dr(1) + kr(1) = 2 ok; 'ongrondror' = ngr(1) + ndr(2) = 3 too heavy.
max_extra_cluster_consonants: 2
# ...except these sequences, which are hard to say or misread in ASCII:
forbidden_sequences:
  - [n, g]       # would be read as the digraph 'ng'
  - [k, h]       # would be read as 'kh'
  - [z, h]
  - [s, h]
  - [t, h]
  - [d, h]
  - [h, r]       # 'h' is only word-initial or intervocalic
  - [h, l]
  - [h, n]
  - [ng, ng]

# Roots may not end in these, so inflected forms stay unambiguous
# (plural -i, past -ad, progressive -en, agent -ki, diminutive -it).
reserved_final_strings: [i, ad, en, ki, it]

# Stress: first syllable of the root, always. Suffixes are unstressed.
stress: root-initial

style:
  # Blend of the two source languages (weights must sum to 1).
  blend: {khazalid: 0.7, zharralid: 0.3}
  # Multipliers applied to the measured frequencies. These are the knobs for
  # "Khazalid core + Zharralid sh/zh + some open vowel endings".
  boost_segments: {sh: 4.0, zh: 2.5, dh: 3.0, kh: 1.5}
  boost_vowel_final: 1.3
  vowel_weights: {a: 0.38, u: 0.22, o: 0.16, i: 0.14, e: 0.10}
  # Total probability mass shared by legal-but-unattested clusters in each
  # position (lets the generator go beyond the source inventory, a little).
  unattested_mass: {initial: 0.04, medial: 0.08, final: 0.04}
